<!doctype html>
<html lang="es">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="dark" />
    <meta
      name="description"
      content="Una aventura mágica y personal dentro de los muros de Hogwarts."
    />
    <title>El Vestíbulo — Una aventura en Hogwarts</title>
    <link rel="icon" href="data:," />
    <link rel="preload" as="image" href="/assets/backgrounds/vestibule-mobile.jpg" media="(max-width: 640px)" />
    <link rel="preload" as="image" href="/assets/backgrounds/vestibule-desktop.jpg" media="(min-width: 641px)" />
    <link rel="stylesheet" href="/src/styles/main.css" />
  </head>
  <body>
    <a class="skip-link" href="#vista-principal">Saltar al contenido principal</a>
    <h1 class="visually-hidden">Hogwarts — una invitación privada</h1>

    <div class="castle-frame">
      <div class="world-chrome">
        <button
          type="button"
          class="chrome-btn chrome-btn--home"
          data-home-control
          aria-label="Volver al vestíbulo"
          hidden
        >
          <span class="chrome-btn__icon" aria-hidden="true" data-home-icon></span>
        </button>

        <button
          type="button"
          class="chrome-btn chrome-btn--sound sound-toggle"
          data-sound-toggle
          aria-pressed="false"
          aria-label="Activar sonido ambiental"
        >
          <span class="sound-toggle__icon" aria-hidden="true"></span>
        </button>
      </div>

      <main id="vista-principal" class="view-stage" data-view-stage tabindex="-1">
        <!-- Las escenas se generan dinámicamente según el lugar activo -->
      </main>

      <p class="view-status" role="status" aria-live="polite" data-view-status></p>

      <div class="t-overlay" aria-hidden="true" data-transition-overlay></div>
    </div>

    <noscript>
      <p class="noscript-warning">
        Esta experiencia requiere JavaScript para revelar sus secretos. Por favor habilita
        JavaScript en tu navegador.
      </p>
    </noscript>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
